name: Publish Home Assistant App

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: read

jobs:
  prepare:
    name: Prepare versioned App image
    runs-on: ubuntu-latest
    outputs:
      architectures: ${{ steps.info.outputs.architectures }}
      build_matrix: ${{ steps.matrix.outputs.matrix }}
      description: ${{ steps.info.outputs.description }}
      image: ${{ steps.normalize.outputs.image }}
      image_name: ${{ steps.normalize.outputs.image_name }}
      name: ${{ steps.info.outputs.name }}
      registry_prefix: ${{ steps.normalize.outputs.registry_prefix }}
      url: ${{ steps.info.outputs.url }}
      version: ${{ steps.release.outputs.version }}
    steps:
      - uses: actions/checkout@v7.0.1
      - name: Read App information
        id: info
        uses: home-assistant/actions/helpers/info@master
        with:
          path: ./homeassistant-addon
      - name: Validate immutable release tag
        id: release
        run: |
          version="${GITHUB_REF_NAME#v}"
          package_version="$(python3 -c 'import tomllib; print(tomllib.load(open("pyproject.toml", "rb"))["project"]["version"])')"

          if [[ ! "${GITHUB_REF_NAME}" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Release tag must use vMAJOR.MINOR.PATCH" >&2
            exit 1
          fi
          if [[ "${version}" != "${package_version}" ]]; then
            echo "Release tag does not match the package version" >&2
            exit 1
          fi
          if ! grep -Fq "## [${version}]" CHANGELOG.md; then
            echo "Root changelog does not contain the release version" >&2
            exit 1
          fi
          if ! grep -Fq "## ${version}" homeassistant-addon/CHANGELOG.md; then
            echo "App changelog does not contain the release version" >&2
            exit 1
          fi

          echo "version=${version}" >> "${GITHUB_OUTPUT}"
      - name: Normalize image information
        id: normalize
        env:
          APP_IMAGE: ${{ steps.info.outputs.image }}
        run: |
          image="${APP_IMAGE//\"/}"
          if [[ ! "${image}" =~ ^ghcr\.io/[a-z0-9._/-]+$ ]]; then
            echo "Invalid App image metadata" >&2
            exit 1
          fi

          echo "image=${image}" >> "${GITHUB_OUTPUT}"
          echo "image_name=${image##*/}" >> "${GITHUB_OUTPUT}"
          echo "registry_prefix=${image%/*}" >> "${GITHUB_OUTPUT}"
      - name: Prepare architecture matrix
        id: matrix
        uses: home-assistant/builder/actions/prepare-multi-arch-matrix@2026.06.0
        with:
          architectures: ${{ steps.info.outputs.architectures }}
          image-name: ${{ steps.normalize.outputs.image_name }}
          registry-prefix: ${{ steps.normalize.outputs.registry_prefix }}

  build:
    name: Publish ${{ matrix.arch }} App image
    needs: prepare
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
      id-token: write
      packages: write
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.prepare.outputs.build_matrix) }}
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - name: Build and publish versioned architecture image
        uses: home-assistant/builder/actions/build-image@2026.06.0
        with:
          arch: ${{ matrix.arch }}
          container-registry-password: ${{ secrets.GITHUB_TOKEN }}
          context: .
          image: ${{ matrix.image }}
          image-tags: ${{ needs.prepare.outputs.version }}
          labels: |
            io.hass.type=app
            io.hass.name=${{ needs.prepare.outputs.name }}
            io.hass.description=${{ needs.prepare.outputs.description }}
            io.hass.url=${{ needs.prepare.outputs.url }}
          push: true
          version: ${{ needs.prepare.outputs.version }}

  manifest:
    name: Publish versioned multi-architecture manifest
    needs: [prepare, build]
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      packages: write
    steps:
      - name: Publish versioned multi-architecture manifest
        uses: home-assistant/builder/actions/publish-multi-arch-manifest@2026.06.0
        with:
          architectures: ${{ needs.prepare.outputs.architectures }}
          container-registry-password: ${{ secrets.GITHUB_TOKEN }}
          image-name: ${{ needs.prepare.outputs.image_name }}
          image-tags: ${{ needs.prepare.outputs.version }}
          registry-prefix: ${{ needs.prepare.outputs.registry_prefix }}

  verify:
    name: Verify version before catalog promotion
    needs: [prepare, manifest]
    runs-on: ubuntu-latest
    steps:
      - uses: docker/setup-buildx-action@v3
      - name: Verify both supported platforms are pullable
        env:
          IMAGE: ${{ needs.prepare.outputs.image }}
          VERSION: ${{ needs.prepare.outputs.version }}
        run: |
          manifest="$(docker buildx imagetools inspect "${IMAGE}:${VERSION}")"
          grep -Eq 'Platform:[[:space:]]+linux/amd64' <<< "${manifest}"
          grep -Eq 'Platform:[[:space:]]+linux/arm64' <<< "${manifest}"
          echo "Version ${VERSION} is safe for a separate catalog-promotion PR."
