name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  advertised-app-image:
    name: Verify advertised App image exists
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Fail closed unless both advertised platforms are pullable
        run: |
          image="$(sed -n 's/^image: *"\{0,1\}\([^" ]*\)"\{0,1\}$/\1/p' homeassistant-addon/config.yaml)"
          version="$(sed -n 's/^version: *"\{0,1\}\([0-9][0-9.]*\)"\{0,1\}$/\1/p' homeassistant-addon/config.yaml)"

          if [[ ! "${image}" =~ ^ghcr\.io/[a-z0-9._/-]+$ ]]; then
            echo "Invalid advertised App image" >&2
            exit 1
          fi
          if [[ ! "${version}" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Invalid advertised App version" >&2
            exit 1
          fi

          manifest="$(docker buildx imagetools inspect "${image}:${version}")"
          grep -Eq 'Platform:[[:space:]]+linux/amd64' <<< "${manifest}"
          grep -Eq 'Platform:[[:space:]]+linux/arm64' <<< "${manifest}"

  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: uv sync --frozen --all-extras
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run mypy
      - run: uv run pytest
