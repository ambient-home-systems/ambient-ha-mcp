# https://developers.home-assistant.io/docs/apps/configuration#app-configuration
name: Ambient Home Assistant MCP
version: "0.6.5"
slug: ambient_ha_mcp
description: Read-only semantic MCP access to Home Assistant
url: "https://github.com/ambient-home-systems/ambient-ha-mcp/tree/main/homeassistant-addon"
arch:
  - aarch64
  - amd64
init: false
stage: experimental
homeassistant_api: true
tmpfs: true
ports:
  8000/tcp: null
ports_description:
  8000/tcp: Local MCP Streamable HTTP endpoint
environment:
  AMBIENT_RUNTIME_MODE: home_assistant_app
options:
  log_level: INFO
  request_timeout_seconds: 10
  registry_cache_ttl_seconds: 60
  history_default_lookback_hours: 24
  history_max_lookback_hours: 168
  history_default_limit: 100
  history_max_events: 500
  history_max_entities: 50
  battery_warning_threshold: 20
  ignored_diagnostic_entities: []
  mcp_allowed_hosts:
    - localhost
    - "localhost:*"
    - 127.0.0.1
    - "127.0.0.1:*"
    - homeassistant.local
    - "homeassistant.local:*"
schema:
  log_level: "list(DEBUG|INFO|WARNING|ERROR|CRITICAL)"
  request_timeout_seconds: "int(1,120)"
  registry_cache_ttl_seconds: "int(5,3600)"
  history_default_lookback_hours: "int(1,168)"
  history_max_lookback_hours: "int(1,720)"
  history_default_limit: "int(1,500)"
  history_max_events: "int(1,1000)"
  history_max_entities: "int(1,100)"
  battery_warning_threshold: "int(1,100)"
  ignored_diagnostic_entities:
    - str
  mcp_allowed_hosts:
    - str
image: "ghcr.io/ambient-home-systems/ambient-ha-mcp"
